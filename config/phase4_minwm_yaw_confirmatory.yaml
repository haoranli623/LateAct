phase: phase4_minwm_yaw_confirmatory
status: protocol_frozen_before_any_confirmatory_inference
purpose: single_bounded_cross_model_yaw_followup

upstream:
  repository: https://github.com/shengshu-ai/minWM
  commit: df522a26cd4409d3e3e8f269cc98eac069b5df47
  backbone: Wan-AI/Wan2.1-T2V-1.3B
  backbone_revision: 37ec512624d61f7aa208f7ea8140a131f93afc9a
  checkpoint_repo: MIN-Lab/minWM
  checkpoint_path: Wan21/Action2V/dmd/model.pt
  checkpoint_revision: 21bd74da43b5a061c0b8ff277515088ccd2c798b
  checkpoint_etag: bdb947d45fb04513305492c2ee393d51d0621ec0e99fd312224f5d61a330aa77

storage:
  artifact_subdirectory: phase4_minwm_yaw_confirmatory
  artifacts: ${oc.env:LATEACT_ARTIFACT_ROOT}/phase4_minwm_yaw_confirmatory
  original_phase4_artifacts_read_only: ${oc.env:LATEACT_ARTIFACT_ROOT}/phase4_minwm
  models: ${oc.env:LATEACT_MINWM_MODEL_ROOT}
  environment: user-managed
  overwrite_policy: fail_if_target_is_nonempty

sampler:
  nfe: 4
  configured_steps: [1000, 750, 500, 250]
  timestep_shift: 5.0
  num_frames: 20
  num_frames_per_block: 4
  resolution: [480, 832]
  dtype: bfloat16
  stochastic_coupling: initial_noise_and_three_renoise_tensors
  model_precision_outside_action_condition: unchanged_bfloat16

control:
  axis: native_yaw_camera_rotation
  negative: j
  positive: l
  trajectory_steps_per_branch: 3
  rotation_degrees_per_step: 3.0
  terminal_rotation_degrees: 9.0
  oracle_endpoint_separation_degrees: 18.0
  old_new_directions: [j_to_l, l_to_j]
  intrinsics: [0.5, 0.5, 0.5, 0.5]
  only_tensor_allowed_to_differ_by_nfe: viewmats

replication:
  scenes: 8
  prompt_source: Wan21/prompts/demos.txt
  prompt_indexing: zero_based
  prompt_indices: [8, 9, 10, 11, 12, 13, 14, 15]
  prompt_file_sha256: 847f82434bf4173dd9a46c2cb05db282876190dfec5b2653a9290ee9c060f5b7
  selected_prompts_sha256: 2e72cbfdbedbec3e7ebfc9f098ec9a4c6e49bc907df867ad602f78f60a75c82b
  seeds: [41008, 41009, 41010, 41011, 41012, 41013, 41014, 41015]
  switch_positions: [0, 1, 2, 3, 4]
  same_action_control_prompt_indices: [8, 9]
  same_action_control: j_to_j
  scene_screening: prohibited
  prompt_replacement: prohibited

evaluator:
  primary: accumulated_robust_affine_horizontal_translation
  description: >-
    Sum the x translation at image center from robust partial-affine fits between
    consecutive decoded frames, using forward/backward-consistent Lucas-Kanade
    tracks at 416x240. Positive means rightward image motion. This is unchanged
    from the frozen a/d Phase 4 evaluator.
  independent_check: forward_backward_lk_median_horizontal_translation
  min_tracks_per_transition: 20
  response: (switch_minus_old)/(new_minus_old)
  clipping: false
  alternative_evaluator: prohibited

validity:
  oracle_videos_must_differ: true
  min_oracle_gap_pixels: 8.0
  evaluator_sign_agreement: true
  same_action_floor_multiplier: 10.0
  visual_check: finite_nonconstant_decoded_video_and_manual_contact_sheet_review

phase4b_pass:
  min_valid_direction_scene_pairs: 12
  min_monotone_pairs: 12
  monotonic_tolerance: 0.10
  min_bounded_pairs: 12
  bounded_range: [-0.10, 1.10]
  min_median_adjacent_drop: 0.15
  min_directions_each_orientation: 6
  required_visual_valid_pairs: 16
  require_same_action_latent_equality: true
  require_stochastic_noise_cache_audits: true

rollback:
  execution: prohibited
  boundary_diagnostic_only: true
  boundary_min_current_response: 0.80
  boundary_max_following_response: 0.65
  boundary_min_adjacent_drop: 0.15

analysis:
  summary_filename: phase4_minwm_yaw_confirmatory_summary.json
  montage_filename: phase4_minwm_yaw_confirmatory_montage.png

termination:
  on_gate_failure: terminate_cross_model_work
  allow_prompt_replacement: false
  allow_threshold_change: false
  allow_alternative_evaluator: false
  allow_additional_action_family: false
  allow_rollback_experiment_in_this_followup: false
